# Reverse proxy TLS devant l'API Zarma.
#
# Remplacer api.exemple.ne par ton domaine, puis :
#   sudo cp infrastructure/nginx/zarma.conf /etc/nginx/sites-available/zarma
#   sudo ln -s /etc/nginx/sites-available/zarma /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.exemple.ne     # écrit les lignes ssl_* ci-dessous
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Le service ASR (port 8001) n'apparaît volontairement PAS ici : il ne doit
# jamais être joignable depuis Internet. Seule l'API le contacte, en local.

# Limite de débit — double la protection applicative (slowapi), au cas où
# celle-ci serait mal configurée. 20 requêtes/minute par IP, rafales tolérées.
limit_req_zone $binary_remote_addr zone=zarma_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.exemple.ne;

    # Tout le trafic passe en HTTPS (NFR3). Seul le renouvellement ACME reste
    # accessible en clair.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.exemple.ne;

    # Renseignés par certbot :
    # ssl_certificate     /etc/letsencrypt/live/api.exemple.ne/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.exemple.ne/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Un WAV de 8 s en 16 kHz mono pèse ~256 Ko ; l'API refuse au-delà de ~2 Mo
    # (NFR5). On coupe donc bien avant, au niveau du proxy.
    client_max_body_size 3m;

    # L'inférence prend quelques secondes ; le délai doit dépasser celui de
    # l'API (30 s) pour que ce soit l'API qui décide du repli, pas nginx.
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;

    # Page publique exigée par Google Play. Le fichier est versionné avec
    # l'application et doit rester accessible sans authentification.
    location = /privacy {
        alias /opt/zarma/docs/play-store/privacy-policy.html;
        default_type text/html;
        expires 1h;
    }

    location /api/v1/recognize {
        limit_req zone=zarma_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    access_log /var/log/nginx/zarma.access.log;
    error_log  /var/log/nginx/zarma.error.log;
}
