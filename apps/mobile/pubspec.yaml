name: zarma_mobile
description: Application Android de reconnaissance des nombres en zarma.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  dio: 5.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: 2.5.1
  path_provider: 2.1.5
  permission_handler: 11.3.1
  record: 5.2.1

# record 5.2.1 allows newer platform packages whose interfaces are mutually
# incompatible. These versions are the compatible Flutter 3.24/Dart 3.5 set.
dependency_overrides:
  record_android: 1.4.0
  record_linux: 1.2.1
  record_platform_interface: 1.4.0
  record_web: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
