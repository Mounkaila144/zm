name: zarma_mobile
description: Application Android de reconnaissance des nombres en zarma.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  audioplayers: ^6.8.1
  dio: 5.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: 2.5.1
  path_provider: 2.1.5
  permission_handler: 11.3.1
  record: 5.2.1

# record 5.2.1 allows newer platform packages whose interfaces are mutually
# incompatible. These versions are the compatible Flutter 3.24/Dart 3.5 set.
dependency_overrides:
  record_android: 1.4.0
  record_linux: 1.2.1
  record_platform_interface: 1.4.0
  record_web: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Banque vocale embarquée (story 6.1) — l'application doit pouvoir *dire* le
  # résultat sans réseau : sur un marché, la connexion n'est pas acquise.
  # ~940 Ko de WAV 16 kHz mono ; c'est le produit lui-même, pas une ressource
  # accessoire. Les mots sont assemblés à la volée depuis la forme canonique
  # renvoyée par l'API — aucune phrase pré-enregistrée, sauf les consignes.
  assets:
    - assets/voice/words/
    - assets/voice/prompts/
    - assets/brand/
    - brand-source/logo.png
