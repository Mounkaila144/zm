[project]
name = "zarma-api"
version = "0.1.0"
description = "Service API FastAPI Zarma (léger, sans GPU) — santé, versions et endpoints du moteur linguistique."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi==0.115.*",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic==2.9.*",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.9",
    "soundfile>=0.12",
    "soxr>=0.5",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.0",
    "uvicorn>=0.30",
    # Dépendance interne : source unique de vérité pour grammar_version (isolation stricte).
    "zarma_numbers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Résolution en editable depuis le workspace uv racine (le paquet cœur n'est jamais publié).
[tool.uv.sources]
zarma_numbers = { workspace = true }

# Config pytest locale (utilisée quand pytest est lancé depuis services/api).
# Depuis la racine, la config racine prime — voir pyproject.toml racine.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
