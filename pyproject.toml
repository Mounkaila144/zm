[project]
name = "zarma-workspace"
version = "0.1.0"
description = "Monorepo Zarma — workspace Python (uv)."
requires-python = ">=3.11"
# Racine de workspace non-packageable : sert uniquement à coordonner les membres.
dependencies = []

[dependency-groups]
# Outillage transverse + cœur linguistique installé en editable dans le workspace.
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "pytest>=8.0",
    "hypothesis>=6.0",
    "zarma_numbers",
    # Service API installé en editable dans le workspace (fournit fastapi, uvicorn…).
    "zarma-api",
    # Outillage de test du service API (client TestClient/httpx + support async).
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.uv.workspace]
# Le client ASR (services/asr) rejoindra le workspace quand il aura du code (Epic 5).
members = ["packages/zarma_numbers", "services/api"]

[tool.uv.sources]
zarma_numbers = { workspace = true }
zarma-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "node_modules|\\.venv"

[tool.pytest.ini_options]
testpaths = [
    "packages/zarma_numbers/tests",
    "services/api/tests",
    "scripts/bench/tests",
    # Tests du décodeur contraint (story 5.6) — sans GPU : decoding.py est
    # auto-contenu (numpy) et chargé par importlib (cf. services/asr/tests/conftest.py).
    "services/asr/tests",
    # Restitution vocale par concaténation (story 6.1) — logique pure, WAV
    # synthétiques en tmp_path : ni audio réel, ni réseau.
    "scripts/speech/tests",
]
pythonpath = [
    "packages/zarma_numbers/src",
    "services/api",
    "scripts/bench",
    "scripts/speech",
]
addopts = "-ra"
